quarkus.application.name=plan-generator-bot
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Telegram payloads are snake_case; records use camelCase
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.serialization-inclusion=non-null

# DB: always from env (Neon in prod). Own schema so Flyway history does not clash with other apps.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/plangen}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=4
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=plangen
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=plangen
quarkus.flyway.default-schema=plangen

# App
app.timezone=${APP_TIMEZONE:Asia/Almaty}
app.bot.token=${BOT_TOKEN:dev-token}
app.bot.webhook-secret=${WEBHOOK_SECRET:dev-secret}
# comma separated Telegram user ids allowed to use the bot; empty = nobody
app.bot.allowed-ids=${ALLOWED_IDS:}
app.defaults.lesson-minutes=45
app.limits.daily-plans=${DAILY_PLAN_LIMIT:40}

quarkus.rest-client.telegram.url=https://api.telegram.org/bot${app.bot.token}
quarkus.rest-client.telegram.connect-timeout=5000
quarkus.rest-client.telegram.read-timeout=30000

# OpenAI via LangChain4j (structured output into Java records)
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.timeout=90s
quarkus.langchain4j.openai.timeout=90s
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-5-mini}
quarkus.langchain4j.openai.chat-model.response-format=json_schema
quarkus.langchain4j.openai.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.chat-model.max-completion-tokens=${OPENAI_MAX_TOKENS:6000}
quarkus.langchain4j.openai.chat-model.reasoning-effort=${OPENAI_REASONING:low}
